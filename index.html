<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>여러 가지 사각형을 알아봐요 - 네모네모 컴퍼니</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3d; --navy2:#16295a; --gold:#ffc83d; --red:#ff3b5c; --green:#1fc77e; --blue:#3b8cff;
  --paper:#fffdf6; --ink:#1d2433; --grid:#5ec8f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow-x:hidden;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(120,170,255,.35), transparent 60%),
    linear-gradient(180deg,#0b1533 0%,#1a2d63 55%,#2a3f7a 100%);
  min-height:100vh;
}
/* 빌딩 야경 */
#city{position:fixed;inset:auto 0 0 0;height:46vh;pointer-events:none;z-index:0;opacity:.55}
#city .b{position:absolute;bottom:0;background:
  repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.0) 10px 14px),
  linear-gradient(#18244a,#0e1631);border-top:3px solid #24356b}
#city .b::before{content:"";position:absolute;inset:12px 8px 0 8px;
  background:
   repeating-linear-gradient(0deg,transparent 0 14px,rgba(10,16,40,1) 14px 22px),
   repeating-linear-gradient(90deg,rgba(255,214,120,.85) 0 8px,rgba(10,16,40,1) 8px 16px);
  opacity:.55;mask-image:linear-gradient(transparent,#000 20%)}
.font-j{font-family:'Jua',sans-serif}
button{font-family:'Jua',sans-serif;cursor:pointer;border:none}
.hidden{display:none!important}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:12px 14px 40px}

/* ===== 시작 화면 ===== */
#start{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:#fff}
.logo{font-family:'Jua';font-size:20px;letter-spacing:4px;color:var(--gold);display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border:4px solid var(--gold);transform:rotate(12deg)}
.title{font-family:'Jua';font-size:clamp(34px,6.5vw,64px);line-height:1.1;margin:0;
  background:linear-gradient(180deg,#fff 30%,#ffe08a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.sub{font-size:18px;opacity:.9}
.startcard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);
  border-radius:24px;padding:22px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.startcard input{width:100%;font-size:24px;font-family:'Jua';padding:14px 18px;border-radius:14px;border:3px solid #ffd76a;
  text-align:center;outline:none;background:#fffbea;color:#333;user-select:text;-webkit-user-select:text}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rule{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 8px;font-size:14px;line-height:1.45}
.rule b{display:block;font-family:'Jua';font-size:28px;margin-bottom:4px}
.bigbtn{font-size:26px;padding:16px 34px;border-radius:18px;color:#3a2600;
  background:linear-gradient(180deg,#ffe48a,#ffb703);box-shadow:0 7px 0 #b97900,0 14px 30px rgba(0,0,0,.35);
  transition:transform .08s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #b97900}
.btn2{font-size:18px;padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.ranks-strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px;margin-top:10px}
.ranks-strip span{background:rgba(255,255,255,.12);padding:4px 9px;border-radius:99px}

/* ===== HUD ===== */
#hud{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:stretch;padding:8px 0 10px;
  background:linear-gradient(#0b1533 70%,transparent)}
.badge{display:flex;gap:10px;align-items:center;background:linear-gradient(160deg,#fff,#e9eefc);border-radius:16px;padding:8px 12px;
  box-shadow:0 6px 0 #9fb0dd;min-width:250px;position:relative}
.badge::before{content:"";position:absolute;top:-10px;left:50%;width:26px;height:12px;background:#c43a52;border-radius:4px 4px 0 0;transform:translateX(-50%)}
.badge .ph{width:52px;height:60px;border-radius:10px;background:linear-gradient(#bfe3ff,#86c3ff);display:grid;place-items:center;font-size:32px;border:2px solid #fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.badge .co{font-size:10px;color:#6a7aa6;letter-spacing:1px}
.badge .nm{font-family:'Jua';font-size:20px;line-height:1.1}
.badge .rk{font-family:'Jua';font-size:15px;color:#fff;background:var(--navy2);display:inline-block;padding:1px 10px;border-radius:99px;margin-top:2px}
.xpwrap{flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 14px;color:#fff;display:flex;flex-direction:column;justify-content:center;min-width:160px}
.xpline{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.xpbar{height:16px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:5px;position:relative}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cf2a5,#2bd3ff);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 0 12px #4cf2a5}
.stats{display:flex;gap:8px}
.stat{background:rgba(255,255,255,.1);color:#fff;border-radius:14px;padding:6px 10px;text-align:center;min-width:58px}
.stat b{display:block;font-family:'Jua';font-size:22px;line-height:1.1}
.stat small{font-size:11px;opacity:.8}
.hudbtns{display:flex;gap:6px}
.hb{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:6px 10px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2)}
.hb span{font-size:22px}
.combo{color:#ffb15c}
.combo.hot b{animation:flame .5s infinite alternate;color:#ff7a2f}
@keyframes flame{to{transform:scale(1.15);text-shadow:0 0 10px #ff9a3c}}

/* ===== 문제 카드 ===== */
#qcard{background:var(--paper);border-radius:26px;padding:20px 22px 24px;box-shadow:0 14px 0 #c9c1a3,0 30px 60px rgba(0,0,0,.4);position:relative;
  background-image:linear-gradient(rgba(94,200,240,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,200,240,.07) 1px,transparent 1px);background-size:22px 22px}
#qcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px) rotate(-.6deg)}40%,80%{transform:translateX(12px) rotate(.6deg)}}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:'Jua';background:linear-gradient(#ff6b84,#ff3b5c);color:#fff;border-radius:99px;padding:4px 14px;font-size:18px;box-shadow:0 3px 0 #b81d3a}
.qtype{font-family:'Jua';background:#ffe56b;border-radius:10px;padding:3px 12px;font-size:15px;transform:rotate(-2deg)}
.qtry{margin-left:auto;font-size:14px;color:#8a8a8a}
.qtext{font-family:'Jua';font-size:clamp(22px,3.2vw,32px);margin:12px 4px 14px;line-height:1.35;word-break:keep-all}
.qtext em{font-style:normal;color:#e8204a;background:linear-gradient(transparent 60%,#ffe2e8 60%)}
.visual{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end;margin:6px 0 16px}
.shapecard{background:#fff;border:3px solid #e2e8f0;border-radius:18px;padding:6px;position:relative;transition:transform .12s, border-color .12s, box-shadow .12s;box-shadow:0 5px 0 #d5dce6}
.shapecard.ans{cursor:pointer}
.shapecard.ans:hover{transform:translateY(-3px)}
.shapecard.sel{border-color:#ff3b5c;box-shadow:0 5px 0 #ff9aac,0 0 0 4px rgba(255,59,92,.15)}
.shapecard .mark{position:absolute;top:-14px;right:-12px;width:44px;height:44px;border:5px solid #ff2d55;border-radius:50%;opacity:0;transform:scale(2.2) rotate(-20deg);transition:.18s;background:rgba(255,255,255,.4)}
.shapecard.sel .mark{opacity:1;transform:scale(1) rotate(0)}
svg text{font-family:'Jua'}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{font-size:24px;padding:14px 22px;border-radius:16px;background:#fff;border:3px solid #d8dfeb;box-shadow:0 6px 0 #cbd3e1;color:#223;position:relative;min-width:120px;transition:transform .08s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #cbd3e1}
.opt.sel{border-color:#ff3b5c;background:#fff3f5;box-shadow:0 6px 0 #ff9aac}
.opt.sel::after{content:"";position:absolute;inset:-6px -6px;border:4px solid rgba(255,45,85,.85);border-radius:50%;animation:stamp .2s ease-out}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.prop{font-family:'Noto Sans KR';font-weight:700;font-size:19px;text-align:left;min-width:min(440px,100%)}
.prop b{font-family:'Jua';color:#1d6fe0;margin-right:8px;font-size:22px}
.oxrow{display:flex;gap:26px;justify-content:center}
.oxbtn{width:min(220px,40vw);height:min(200px,36vw);border-radius:28px;font-size:min(130px,24vw);line-height:1;display:grid;place-items:center;background:#fff;position:relative;transition:transform .1s}
.oxbtn.o{color:#ff2d55;border:6px solid #ff8aa1;box-shadow:0 10px 0 #ff8aa1}
.oxbtn.x{color:#2b7bff;border:6px solid #8db7ff;box-shadow:0 10px 0 #8db7ff}
.oxbtn:hover{transform:translateY(-4px) rotate(-2deg)}
.oxbtn:active{transform:translateY(6px);box-shadow:0 3px 0 #ccc}
.oxbtn small{position:absolute;bottom:10px;font-size:16px;color:#999}
.submitrow{display:flex;gap:12px;justify-content:center;margin-top:22px}
.submit{font-size:26px;padding:14px 46px;border-radius:18px;color:#fff;background:linear-gradient(#36d58f,#12a866);box-shadow:0 7px 0 #0b7a49}
.submit:active{transform:translateY(5px);box-shadow:0 2px 0 #0b7a49}
.clear{font-size:18px;padding:12px 20px;border-radius:16px;background:#eef1f6;color:#556;box-shadow:0 5px 0 #cfd6e2}
/* 표 */
.otable{border-collapse:separate;border-spacing:6px;margin:0 auto}
.otable th{font-family:'Jua';font-size:18px;padding:6px 10px;border-radius:10px;background:#fde5c8;white-space:nowrap}
.otable th.rowh{background:#e5efff;text-align:left}
.cell{width:56px;height:52px;border-radius:12px;background:#fff;border:2px dashed #c8d0dd;font-family:'Jua';font-size:34px;position:relative}
.cell.O{color:#ff2d55;border:2px solid #ffb3c1;background:#fff6f8}
.cell.X{color:#2b7bff;border:2px solid #b5ceff;background:#f4f8ff}
.cell.O,.cell.X{animation:stamp .18s}
.tabwrap{overflow-x:auto;padding-bottom:6px}
.tip{font-size:14px;color:#7a8296;text-align:center;margin-top:8px}

/* 떠오르는 점수 */
.floaty{position:fixed;z-index:80;font-family:'Jua';font-size:42px;pointer-events:none;animation:floatup 1.2s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.25)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(.6)}20%{transform:translate(-50%,-20px) scale(1.2)}to{opacity:0;transform:translate(-50%,-120px) scale(1)}}
.bigstamp{position:fixed;left:50%;top:42%;z-index:70;font-family:'Jua';font-size:clamp(60px,12vw,120px);pointer-events:none;
  transform:translate(-50%,-50%);animation:bigst .9s ease-out forwards;white-space:nowrap}
@keyframes bigst{0%{transform:translate(-50%,-50%) scale(3) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-6deg)}}

/* ===== 모달 ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.modal{background:#fff;border-radius:26px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal h2{font-family:'Jua';font-size:34px;margin:0 0 6px;text-align:center}
.modal .lead{text-align:center;font-size:18px;color:#555;margin-bottom:12px}
.explain{background:#f4f8ff;border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.7;word-break:keep-all}
.explain.hint{background:#fff8e6}
.explain .ln{padding:3px 0;border-bottom:1px dashed #d7e0f0}
.explain .ln:last-child{border:none}
.ok{color:#11a35f;font-weight:900}.no{color:#e8204a;font-weight:900}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.mbtn{font-size:22px;padding:12px 30px;border-radius:16px;color:#fff;background:linear-gradient(#5a9bff,#2b6fe8);box-shadow:0 6px 0 #1a4bb0}
.mbtn.gold{color:#3a2600;background:linear-gradient(#ffe48a,#ffb703);box-shadow:0 6px 0 #b97900}
.mbtn.gray{background:#e9edf3;color:#445;box-shadow:0 6px 0 #c3cad6}
.mbtn:disabled{filter:grayscale(.6);opacity:.6}
.mbtn:active{transform:translateY(4px);box-shadow:none}

/* 인사발령 */
.decree{background:#fffaf0;border:2px solid #d9c7a3;border-radius:6px;padding:26px 24px;position:relative;font-family:'Noto Sans KR';
  box-shadow:inset 0 0 0 8px #fffaf0,inset 0 0 0 10px #c9a96a}
.decree h3{font-family:'Noto Sans KR';font-weight:900;letter-spacing:14px;text-align:center;font-size:28px;margin:0 0 16px}
.decree .row{font-size:18px;margin:8px 0}
.decree .big{font-family:'Jua';font-size:34px;text-align:center;margin:14px 0}
.decree .big .arrow{color:#999;margin:0 10px}
.seal{position:absolute;right:22px;bottom:18px;width:96px;height:96px;border:5px solid #e0242e;border-radius:50%;color:#e0242e;font-family:'Jua';
  display:grid;place-items:center;font-size:28px;transform:rotate(-14deg) scale(3);opacity:0;animation:sealin .45s .5s cubic-bezier(.3,1.6,.5,1) forwards;text-align:center;line-height:1}
.seal small{font-size:11px;display:block}
@keyframes sealin{to{opacity:.9;transform:rotate(-14deg) scale(1)}}
.decree.down{background:#fff3f3}
/* 광클 경보 */
#spam{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:20px;
  background:repeating-linear-gradient(45deg,rgba(200,0,30,.92) 0 40px,rgba(140,0,20,.92) 40px 80px);animation:alarm .5s infinite alternate}
@keyframes alarm{to{filter:brightness(1.35)}}
#spam .siren{font-size:90px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#spam h1{font-family:'Jua';font-size:clamp(40px,8vw,80px);margin:8px 0;text-shadow:0 6px 0 #500}
#spam p{font-size:22px;max-width:620px;line-height:1.5;font-weight:700}
#spam .cnt{font-family:'Jua';font-size:60px;margin-top:10px}

/* ===== 보상 상자 ===== */
#gacha{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#2b2f6b,#090b20 70%);overflow:hidden}
#gacha .rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:45%;transform:translate(-50%,-50%);opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.14) 0 8deg,transparent 8deg 20deg);animation:rot 12s linear infinite;transition:opacity .5s}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
#gacha .say{font-family:'Jua';color:#fff;font-size:28px;margin-bottom:20px;z-index:2;text-align:center}
.box{width:220px;height:200px;position:relative;cursor:pointer;z-index:2;filter:drop-shadow(0 30px 30px rgba(0,0,0,.6))}
.box .lid{position:absolute;left:-10px;right:-10px;top:0;height:60px;border-radius:14px;background:linear-gradient(#ff6b8b,#d6224a);box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);z-index:2;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.box .body{position:absolute;left:0;right:0;top:52px;bottom:0;border-radius:0 0 18px 18px;background:linear-gradient(90deg,#c21c40,#ff4f74 40%,#e0305a 60%,#a5122f);box-shadow:inset 0 10px 0 rgba(0,0,0,.15)}
.box .rib{position:absolute;left:50%;width:40px;transform:translateX(-50%);top:0;bottom:0;background:linear-gradient(90deg,#f7c948,#ffe590,#e0a91f);z-index:3}
.box .bow{position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:60px;z-index:4}
.box .q{position:absolute;inset:70px 0 0 0;display:grid;place-items:center;font-family:'Jua';font-size:70px;color:rgba(255,255,255,.85);z-index:3;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.box.tap{animation:boxtap .3s}
@keyframes boxtap{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
.box.glow{animation:boxglow .9s infinite alternate}
@keyframes boxglow{from{filter:drop-shadow(0 0 20px var(--tc)) drop-shadow(0 0 40px var(--tc))}to{filter:drop-shadow(0 0 40px var(--tc)) drop-shadow(0 0 90px var(--tc));transform:scale(1.06)}}
.box.open .lid{transform:translateY(-160px) rotate(-25deg)}
.taps{display:flex;gap:10px;margin-top:22px;z-index:2}
.taps i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}
.taps i.on{background:#ffd34d;box-shadow:0 0 12px #ffd34d}
#flash{position:fixed;inset:0;background:#fff;z-index:65;pointer-events:none;opacity:0}
#flash.go{animation:flash .6s}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.card{width:min(300px,78vw);border-radius:22px;padding:6px;position:relative;z-index:3;animation:cardin .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:rotateY(180deg) scale(.3);opacity:0}}
.card .in{border-radius:18px;background:linear-gradient(160deg,#1b1f45,#0f1230);padding:18px 16px 18px;text-align:center;color:#fff;position:relative;overflow:hidden}
.card .tier{font-family:'Jua';font-size:18px;padding:3px 14px;border-radius:99px;display:inline-block;color:#111}
.card .art{font-size:110px;line-height:1.25;margin:10px 0 2px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.card .nm{font-family:'Jua';font-size:28px}
.card .ds{font-size:15px;opacity:.85;margin-top:6px;line-height:1.5;word-break:keep-all}
.card .new{position:absolute;top:10px;left:10px;background:#ff3b5c;font-family:'Jua';padding:2px 10px;border-radius:8px;font-size:15px;transform:rotate(-8deg)}
.card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.4s infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.t-common{background:linear-gradient(135deg,#c9d1db,#8d99a8)}
.t-uncommon{background:linear-gradient(135deg,#8af0b4,#1aa65a)}
.t-rare{background:linear-gradient(135deg,#9cc6ff,#2563eb)}
.t-epic{background:linear-gradient(135deg,#e2b0ff,#8b2cf5)}
.t-legend{background:linear-gradient(135deg,#fff3a8,#ffb400,#ff7a00)}
.t-myth{background:linear-gradient(90deg,#ff4d6d,#ffb84d,#fff04d,#4dff88,#4dc3ff,#9b6bff,#ff4d6d);background-size:300% 100%;animation:rainbow 2s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:66}

/* 도감 */
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ci{border-radius:14px;padding:3px}
.ci .in{background:#141834;color:#fff;border-radius:11px;text-align:center;padding:8px 4px;min-height:120px}
.ci .e{font-size:44px}
.ci .n{font-family:'Jua';font-size:14px;line-height:1.2}
.ci .c{font-size:12px;opacity:.7}
.ci.lock .e{filter:brightness(0) opacity(.5)}
.tierleg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 14px;font-size:13px}
.tierleg span{padding:2px 10px;border-radius:99px;font-family:'Jua';color:#111}

function classify(p){
  const v=[0,1,2,3].map(i=>[p[(i+1)%4][0]-p[i][0],p[(i+1)%4][1]-p[i][1]]);
  const cr=(a,b)=>a[0]*b[1]-a[1]*b[0], dt=(a,b)=>a[0]*b[0]+a[1]*b[1], L=a=>a[0]*a[0]+a[1]*a[1];
  const par02=cr(v[0],v[2])===0, par13=cr(v[1],v[3])===0;
  const trap=par02||par13, para=par02&&par13;
  const len=v.map(L);
  const rhom=len.every(l=>l===len[0]);
  const allRight=[0,1,2,3].every(i=>dt(v[i],v[(i+1)%4])===0);
  const rect=allRight, sq=allRight&&rhom;
  const oppEq=len[0]===len[2]&&len[1]===len[3];
  return {trap,para,rhom,rect,sq,oppEq};
}

function quadSVG(pts,o={}){
  const cell=o.cell||20,pad=o.pad??1;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mx=Math.min(...xs)-pad,Mx=Math.max(...xs)+pad,my=Math.min(...ys)-pad,My=Math.max(...ys)+pad;
  const W=(Mx-mx)*cell,H=(My-my)*cell;
  let g='';
  for(let x=0;x<=Mx-mx;x++)g+=`<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${H}"/>`;
  for(let y=0;y<=My-my;y++)g+=`<line x1="0" y1="${y*cell}" x2="${W}" y2="${y*cell}"/>`;
  const P=pts.map(p=>[(p[0]-mx)*cell,(p[1]-my)*cell]);
  const cx=P.reduce((s,p)=>s+p[0],0)/4,cy=P.reduce((s,p)=>s+p[1],0)/4;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block">
   <rect width="${W}" height="${H}" fill="#fff"/>
   <g stroke="${'#7fd3f3'}" stroke-width="1" stroke-dasharray="3 3">${g}</g>
   <polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="${o.fill||'rgba(255,255,255,0)'}" stroke="#1e2330" stroke-width="2.6" stroke-linejoin="round"/>
   ${o.label?`<text x="${cx}" y="${cy+9}" font-size="${o.fs||26}" text-anchor="middle" fill="#1e2330">${o.label}</text>`:''}
  </svg>`;
}

function tone(f,d,type='sine',w=0,vol=.18){const a=ac();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
 const t=a.currentTime+w;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}

const GENS=[[genPickShapes,3],[genNameShape,2.2],[genProps,2],[genOX,3],[genPicOX,2],[genTangram,2],[genSticks,1.4],[genStrip,1]];
function genQ(){
  for(let t=0;t<20;t++){
    let r=Math.random()*GENS.reduce((s,g)=>s+g[1],0),g;
    for(const G of GENS){r-=G[1];if(r<=0){g=G[0];break}} g=g||GENS[0][0];
    if(lastTypes.slice(-2).includes(g.name))continue;
    if(g===genStrip&&lastTypes.slice(-6).includes('genStrip'))continue;
    lastTypes.push(g.name);if(lastTypes.length>8)lastTypes.shift();

  }

}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],animing=false;
function confetti(n,cols){
  cv.width=innerWidth;cv.height=innerHeight;
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(cols),l:120+rnd(60),sh:rnd(3)});
  if(!animing){animing=true;requestAnimationFrame(step)}
}
function step(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.sh===0)cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);else if(p.sh===1){cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s,0);cx.lineTo(0,p.s);cx.lineTo(-p.s,0);cx.fill()}else cx.fillRect(-p.s,-p.s/4,p.s*2,p.s/2);
    cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+40);
  if(parts.length)requestAnimationFrame(step);else{animing=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ================== 도감 / 퇴근 ================== */
$('#collBtn').onclick=()=>{
  SFX.click();
  const own=ITEMS.filter(i=>S.coll[i.id]).length;
  modal(`<h2>📒 보상 도감</h2><div class="lead">${own} / ${ITEMS.length} 수집</div>
   <div class="tierleg">${TIERS.map(t=>`<span class="t-${t.k}">${t.n}</span>`).join('')}</div>
   <div class="coll">${TIERS.map(t=>ITEMS.filter(i=>i.t===t.k).map(i=>{const h=S.coll[i.id];return `<div class="ci t-${t.k} ${h?'':'lock'}"><div class="in"><div class="e">${i.e}</div><div class="n">${h?i.n:'???'}</div><div class="c">${h?'× '+h:t.n}</div></div></div>`}).join('')).join('')}</div>`,
   [{t:'닫기',v:1}],{delay:200});
};
$('#sndBtn').onclick=()=>{soundOn=!soundOn;$('#sndBtn span').textContent=soundOn?'🔊':'🔇'};
$('#endBtn').onclick=async()=>{
  if(locked)return;
  const tot=SES.ok+SES.no,acc=tot?Math.round(SES.ok/tot*100):0;
  const gr=tot<5?'-':acc>=90&&SES.spam===0?'S':acc>=75?'A':acc>=55?'B':'C';
  const r0=SES.startRank,r1=rankIdx(S.xp);
  const v=await modal(`<h2>📋 오늘의 인사고과</h2><div class="lead">${esc(S.name)} ${RANKS[r1].n}님, 오늘도 수고했어요!</div>
    <div class="grade">${gr}</div><div class="lead" style="font-size:14px">${tot<5?'5문제 이상 풀면 등급이 나와요':'등급 기준: 정답률과 광클 여부'}</div>
    <table class="report" style="margin:0 auto">
     <tr><td>정답 / 오답</td><td>${SES.ok} / ${SES.no}</td></tr>
     <tr><td>정답률</td><td>${acc}%</td></tr>
     <tr><td>최고 연속 정답</td><td>🔥 ${SES.best}</td></tr>
     <tr><td>광클 적발</td><td>${SES.spam}회</td></tr>
     <tr><td>직급 변화</td><td>${RANKS[r0].n} ➜ ${RANKS[r1].n}</td></tr>
     <tr><td>오늘 얻은 카드</td><td>${SES.items.length}장</td></tr>
    </table><div style="text-align:center;font-size:32px;margin-top:8px">${SES.items.map(id=>ITEMS.find(i=>i.id===id).e).join(' ')}</div>`,
    [{t:'계속 일하기',v:'c'},{t:'🏠 처음 화면으로',v:'h',cls:'gray'}],{delay:400});
  if(v==='h')location.reload();
};
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
</script>
